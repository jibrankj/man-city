<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournaments Hub - MAN CITY Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- PREVENT SCROLLBAR JUMP / EXTRA SPACE -->
  <style>
    html {
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased selection:bg-sky-500 selection:text-white flex flex-col">

  <div class="w-full max-w-5xl mx-auto bg-white min-h-screen flex flex-col shadow-sm border-x border-slate-200/60 pb-16">

    <!-- TOP HEADER -->
    <header class="px-5 md:px-8 py-4 flex items-center justify-between border-b border-slate-100 sticky top-0 bg-white/95 backdrop-blur z-30">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 -ml-2 text-slate-500 hover:text-slate-800 transition flex items-center gap-1.5 text-xs md:text-sm font-bold">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Home
        </a>
      </div>
      <span class="text-xs md:text-sm font-black text-slate-400 uppercase tracking-widest">Club Tournaments</span>
      <img 
  src="logo.png" 
  alt="Club Logo" 
  class="w-10 h-10 object-contain mix-blend-multiply contrast-[1.3] brightness-[1.08]" 
/>
    </header>

    <!-- SPORT SELECTOR TABS -->
    <div class="p-4 md:px-8 bg-slate-50 border-b border-slate-100 grid grid-cols-3 gap-3 md:gap-4">
      <button onclick="switchSport('football')" id="tab-football" class="w-full py-3 px-4 rounded-2xl text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition bg-sky-600 text-white shadow-sm">
        <img src="football logo.png" class="w-5 h-5 object-contain" /> Football
      </button>
      <button onclick="switchSport('cricket')" id="tab-cricket" class="w-full py-3 px-4 rounded-2xl text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">
        <img src="cricket logo.png" class="w-5 h-5 object-contain" /> Cricket
      </button>
      <button onclick="switchSport('volleyball')" id="tab-volleyball" class="w-full py-3 px-4 rounded-2xl text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">
        <img src="volleyball logo.png" class="w-5 h-5 object-contain" /> Volleyball
      </button>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="p-5 md:p-8 space-y-6 flex-1">

      <!-- HERO BANNER -->
      <div id="sport-hero" class="bg-gradient-to-br from-slate-950 via-slate-900 to-sky-950 text-white p-6 md:p-8 rounded-3xl shadow-lg relative overflow-hidden flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div class="relative z-10 space-y-2 max-w-2xl">
          <div class="flex items-center gap-3">
            <span id="cup-badge" class="px-3 py-1 bg-sky-500/20 text-sky-400 border border-sky-400/30 text-[10px] md:text-xs font-bold rounded-full uppercase tracking-wider">
              Registration Open
            </span>
            <span id="cup-fee" class="text-xs md:text-sm font-bold text-amber-400">Entry: ₹ 350</span>
          </div>
          <h1 id="cup-title" class="text-xl md:text-3xl font-black tracking-tight leading-tight">MCFL</h1>
          <p id="cup-desc" class="text-xs md:text-sm text-slate-300">Annual  floodlight tournament.</p>
          
          <div class="pt-3 flex items-center gap-6 text-xs text-slate-300 border-t border-white/10">
            <span id="cup-date" class="flex items-center gap-1.5">
              <i data-lucide="calendar" class="w-4 h-4 text-sky-400"></i> Oct 25 – 28
            </span>
            <span id="cup-venue" class="flex items-center gap-1.5">
              <i data-lucide="map-pin" class="w-4 h-4 text-sky-400"></i> Anfield Football Turf
            </span>
          </div>
        </div>

        <button onclick="openRegisterModal()" class="py-3.5 px-6 bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-500 hover:to-blue-600 text-white text-xs md:text-sm font-black uppercase tracking-wider rounded-2xl shadow-lg transition flex items-center justify-center gap-2 whitespace-nowrap">
          <i data-lucide="trophy" class="w-4 h-4"></i> Register Team
        </button>
      </div>

      <!-- DESKTOP SPLIT VIEW: FIXTURES (LEFT) & REGISTERED TEAMS (RIGHT) -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 pt-2">

        <!-- FIXTURES COLUMN (7 cols on desktop) -->
        <section class="lg:col-span-7 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <h2 class="text-xs md:text-sm font-black text-slate-900 tracking-wider uppercase flex items-center gap-1.5">
              Fixtures & Results <i data-lucide="calendar-days" class="w-4 h-4 text-sky-600"></i>
            </h2>
            <span class="text-[11px] text-slate-400 font-semibold">Official Match Schedule</span>
          </div>

          <div id="fixtures-container" class="space-y-3">
            <!-- Dynamically populated -->
          </div>
        </section>

        <!-- REGISTERED TEAMS COLUMN (5 cols on desktop) -->
        <section class="lg:col-span-5 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <h2 class="text-xs md:text-sm font-black text-slate-900 tracking-wider uppercase flex items-center gap-1.5">
              Registered Teams (<span id="team-count">0</span>) <i data-lucide="users" class="w-4 h-4 text-sky-600"></i>
            </h2>
            <button onclick="openRegisterModal()" class="text-xs font-bold text-sky-600 hover:underline">
              + Register
            </button>
          </div>

          <div id="teams-container" class="space-y-2.5">
            <!-- Dynamically populated from Supabase -->
          </div>
        </section>

      </div>

    </main>

    <!-- REGISTRATION MODAL -->
    <div id="reg-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 space-y-4 shadow-2xl animate-in fade-in slide-in-from-bottom duration-200">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <div>
            <h3 class="text-base font-black text-slate-900">Team Registration</h3>
            <p id="modal-sport-title" class="text-xs text-sky-600 font-semibold">Tournament</p>
          </div>
          <button onclick="closeRegisterModal()" class="p-1.5 text-slate-400 hover:text-slate-700 rounded-full hover:bg-slate-100">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <form id="team-form" onsubmit="handleRegistration(event)" class="space-y-3 text-xs">
          <div>
            <label class="font-bold text-slate-700 block mb-1">Club / Team Name *</label>
            <input id="team-name" type="text" required placeholder="e.g. Red Star FC" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 font-medium" />
          </div>

          <div>
            <label class="font-bold text-slate-700 block mb-1">Captain / Manager Name *</label>
            <input id="captain-name" type="text" required placeholder="Full Name" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 font-medium" />
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="font-bold text-slate-700 block mb-1">WhatsApp Number *</label>
              <input id="captain-phone" type="tel" required placeholder="10-digit number" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 font-medium" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Ward / Locality *</label>
              <input id="team-ward" type="text" required placeholder="e.g. Ward 19" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 font-medium" />
            </div>
          </div>

          <div id="reg-feedback" class="hidden p-2.5 rounded-xl text-center text-xs font-bold"></div>

          <button id="submit-btn" type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow transition flex items-center justify-center gap-2">
            <i data-lucide="check-circle" class="w-4 h-4"></i> Submit Registration
          </button>
        </form>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://xbrpgpfabthotvbuqlhh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhicnBncGZhYnRob3R2YnVxbGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDE4NDYsImV4cCI6MjEwNTExNzg0Nn0.Nz3N-2OFBQ3oFGpTJMxQNBNLbHJBvwnXU0afJO53c30";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tournamentData = {
      football: {
        title: "MCFL SEASON-5",
        badge: "Registration Open",
        fee: "Entry: ₹ 350",
        desc: "Man City Football League",
        date: "Oct 25 – 28",
        venue: "Anfield Football Turf",
        fixtures: [
          { round: "Round of 16 (Match 1)", teamA: "Young Challengers", teamB: "Brothers FC", time: "Oct 25 • 07:30 PM", status: "Upcoming", score: "VS" },
          { round: "Round of 16 (Match 2)", teamA: "Town Team Areethala", teamB: "Evergreen Arts", time: "Oct 25 • 09:00 PM", status: "Upcoming", score: "VS" },
          { round: "Quarter Final", teamA: "Man City FC", teamB: "Winner M1", time: "Oct 27 • 08:00 PM", status: "Scheduled", score: "—" }
        ]
      },
      cricket: {
        title: "MCCL SEASON-2",
        badge: "Registration Open",
        fee: "Entry: ₹ 550",
        desc: "Man City Cricket League",
        date: "Nov 04 – 07",
        venue: "Anfield Football Turf",
        fixtures: [
          { round: "Group A (Match 1)", teamA: "Ward 14 Royals", teamB: "Ward 19 Strikers", time: "Nov 04 • 04:00 PM", status: "Upcoming", score: "VS" },
          { round: "Group B (Match 1)", teamA: "Areethala Blasters", teamB: "Town Super Kings", time: "Nov 05 • 04:00 PM", status: "Upcoming", score: "VS" }
        ]
      },
      volleyball: {
        title: "MCVL SEASON-1",
        badge: "Registration Open",
        fee: "Entry: ₹ 300",
        desc: "Man City Volleyball League",
        date: "Dec 10 – 11",
        venue: "Ministadium",
        fixtures: [
          { round: "Qualifier Match 1", teamA: "Smashers Club", teamB: "United Spikers", time: "Dec 10 • 08:30 PM", status: "Upcoming", score: "VS" }
        ]
      }
    };

    let activeSport = 'football';

    async function loadTeamsFromSupabase(sportKey) {
      const teamsBox = document.getElementById('teams-container');
      teamsBox.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">Loading registered teams...</div>`;

      const { data, error } = await supabaseClient
        .from('tournament_registrations')
        .select('*')
        .eq('sport', sportKey)
        .order('id', { ascending: true });

      if (error) {
        teamsBox.innerHTML = `<div class="p-3 text-xs text-rose-500 text-center">Unable to load teams.</div>`;
        return;
      }

      document.getElementById('team-count').innerText = data ? data.length : 0;

      if (!data || data.length === 0) {
        teamsBox.innerHTML = `
          <div class="p-6 text-center text-xs text-slate-400 bg-slate-50 border border-dashed border-slate-200 rounded-2xl">
            No teams registered yet. Be the first to register!
          </div>`;
        return;
      }

      teamsBox.innerHTML = data.map((t, idx) => `
        <div class="p-3.5 bg-slate-50 border border-slate-100 rounded-2xl flex items-center justify-between text-xs">
          <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-xl bg-sky-100 text-sky-800 font-black flex items-center justify-center text-[11px]">
              ${idx + 1}
            </div>
            <div>
              <h4 class="font-bold text-slate-900">${t.team_name}</h4>
              <p class="text-[10px] text-slate-400">Captain: ${t.captain_name}</p>
            </div>
          </div>
          <span class="px-2.5 py-0.5 bg-slate-200/80 text-slate-600 text-[10px] font-bold rounded-lg">${t.ward}</span>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function renderSport(sportKey) {
      const data = tournamentData[sportKey];
      document.getElementById('cup-title').innerText = data.title;
      document.getElementById('cup-badge').innerText = data.badge;
      document.getElementById('cup-fee').innerText = data.fee;
      document.getElementById('cup-desc').innerText = data.desc;
      document.getElementById('cup-date').innerHTML = `<i data-lucide="calendar" class="w-3.5 h-3.5 text-sky-400"></i> ${data.date}`;
      document.getElementById('cup-venue').innerHTML = `<i data-lucide="map-pin" class="w-3.5 h-3.5 text-sky-400"></i> ${data.venue}`;

      const fixturesBox = document.getElementById('fixtures-container');
      fixturesBox.innerHTML = data.fixtures.map(f => `
        <div class="p-4 bg-slate-50 border border-slate-200/80 rounded-2xl space-y-2.5">
          <div class="flex items-center justify-between text-[11px] font-bold text-slate-400 uppercase">
            <span>${f.round}</span>
            <span class="text-sky-600">${f.status}</span>
          </div>
          <div class="flex items-center justify-between font-black text-slate-800 text-sm py-1">
            <span class="w-2/5 truncate">${f.teamA}</span>
            <span class="w-1/5 text-center text-slate-400 text-xs font-bold">${f.score}</span>
            <span class="w-2/5 truncate text-right">${f.teamB}</span>
          </div>
          <div class="text-[11px] text-slate-400 flex items-center justify-between pt-1 border-t border-slate-200/50">
            <span>${f.time}</span>
            <span class="text-emerald-600 font-semibold">Live Updates on Ground</span>
          </div>
        </div>
      `).join('');

      loadTeamsFromSupabase(sportKey);
      lucide.createIcons();
    }

    function switchSport(sport) {
      activeSport = sport;
      ['football', 'cricket', 'volleyball'].forEach(s => {
        const btn = document.getElementById(`tab-${s}`);
        if (s === sport) {
          btn.className = "w-full py-3 px-4 rounded-2xl text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition bg-sky-600 text-white shadow-sm";
        } else {
          btn.className = "w-full py-3 px-4 rounded-2xl text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition bg-white text-slate-600 border border-slate-200 hover:bg-slate-50";
        }
      });
      renderSport(sport);
    }

    function openRegisterModal() {
      document.getElementById('modal-sport-title').innerText = tournamentData[activeSport].title;
      document.getElementById('reg-feedback').className = 'hidden';
      document.getElementById('reg-modal').classList.remove('hidden');
    }

    function closeRegisterModal() {
      document.getElementById('reg-modal').classList.add('hidden');
    }

    async function handleRegistration(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const feedback = document.getElementById('reg-feedback');

      const team = document.getElementById('team-name').value.trim();
      const captain = document.getElementById('captain-name').value.trim();
      const phone = document.getElementById('captain-phone').value.trim();
      const ward = document.getElementById('team-ward').value.trim();
      const sportTitle = tournamentData[activeSport].title;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Submitting...`;
      lucide.createIcons();

      const { data, error } = await supabaseClient
        .from('tournament_registrations')
        .insert([{
          sport: activeSport,
          tournament_title: sportTitle,
          team_name: team,
          captain_name: captain,
          whatsapp: phone,
          ward: ward
        }]);

      if (error) {
        feedback.innerText = `Registration failed: ${error.message}`;
        feedback.className = 'p-2.5 rounded-xl text-center text-xs font-bold bg-rose-50 text-rose-600 border border-rose-200';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> Submit Registration`;
        lucide.createIcons();
        return;
      }

      feedback.innerText = 'Team successfully registered with club committee!';
      feedback.className = 'p-2.5 rounded-xl text-center text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200';
      
      document.getElementById('team-form').reset();
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> Submit Registration`;
      lucide.createIcons();

      setTimeout(() => {
        closeRegisterModal();
        loadTeamsFromSupabase(activeSport);
      }, 1200);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const requestedSport = urlParams.get('sport');
      if (requestedSport && tournamentData[requestedSport]) {
        switchSport(requestedSport);
      } else {
        renderSport('football');
      }
    });
  </script>
</body>
</html>
