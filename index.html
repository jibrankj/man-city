<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - MAN CITY Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash-screen');
      if (!splash) return;

      if (sessionStorage.getItem('splashPlayed')) {
        splash.remove(); // Skip immediately on repeat page visits
      } else {
        sessionStorage.setItem('splashPlayed', 'true');
        setTimeout(() => {
          splash.classList.add('opacity-0', 'pointer-events-none', 'scale-105');
          setTimeout(() => splash.remove(), 700);
        }, 1300);
      }
    });
  </script>
  <style>
    @keyframes progressLine {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.03); }
    }
    .animate-progress {
      animation: progressLine 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .animate-float {
      animation: floatLogo 2s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased flex flex-col justify-between selection:bg-sky-500 selection:text-white">
<!-- SPLASH INTRO ANIMATION -->
  <div id="splash-screen" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center text-white transition-all duration-700 ease-out select-none">
    <div class="relative flex flex-col items-center text-center px-4">
      
      <!-- Glowing Emblem -->
      <div class="relative mb-5">
        <div class="absolute -inset-4 bg-sky-500/25 rounded-full blur-2xl animate-pulse"></div>
        <div class="w-20 h-20 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-md flex items-center justify-center shadow-2xl animate-float">
          <img src="logo.png" alt="Club Logo" class="w-12 h-12 object-contain" />
        </div>
      </div>

      <!-- Typography -->
      <h1 class="text-2xl md:text-3xl font-black tracking-widest uppercase text-white drop-shadow-md">
        MAN CITY
      </h1>
      <p class="text-[10px] md:text-xs font-bold text-sky-400 tracking-[0.3em] uppercase mt-1">
        Arts & Sports Club
      </p>

      <!-- Minimal Progress Indicator -->
      <div class="w-36 h-1 bg-white/10 rounded-full mt-7 overflow-hidden">
        <div class="h-full bg-gradient-to-r from-sky-500 to-blue-500 rounded-full animate-progress"></div>
      </div>
    </div>
  </div>
  <!-- TOP HEADER -->
  <header class="px-5 md:px-8 py-4 flex items-center justify-between border-b border-slate-200/60 bg-white/95 backdrop-blur">
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="Club Logo" class="w-8 h-8 object-contain mix-blend-multiply" />
      <div>
        <span class="font-black text-slate-900 text-sm tracking-tight uppercase">MAN CITY</span>
        <span class="text-[10px] block font-bold text-sky-600 uppercase tracking-wider">Arts & Sports Club</span>
      </div>
    </div>
    <a href="home.html" class="text-slate-500 hover:text-slate-800 transition flex items-center gap-1 text-xs font-bold">
      Skip to Site <i data-lucide="chevron-right" class="w-4 h-4"></i>
    </a>
  </header>

  <!-- AUTHENTICATION CARD -->
  <main class="flex-1 flex items-center justify-center p-5">
    <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-6 md:p-8 space-y-6 shadow-sm">
      
      <!-- ICON & TITLE -->
      <div class="text-center space-y-1.5">
        <div class="w-12 h-12 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center mx-auto mb-2 shadow-sm">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-black text-slate-900">Club Sign In</h1>
        <p class="text-xs text-slate-500">Sign in for committee access or enter as a public guest.</p>
      </div>

      <!-- OFFICER SIGN-IN FORM -->
      <form onsubmit="handleLogin(event)" class="space-y-3.5 text-xs">
        <div>
          <label class="font-bold text-slate-700 block mb-1">Official Email</label>
          <input id="login-email" type="email" required placeholder="role@mancity.com" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 font-medium" />
        </div>

        <div>
          <label class="font-bold text-slate-700 block mb-1">Password</label>
          <input id="login-password" type="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 font-medium" />
        </div>

        <div id="login-error" class="hidden p-2.5 rounded-xl text-center text-xs font-bold bg-rose-50 text-rose-600 border border-rose-200"></div>

        <button id="login-btn" type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow transition flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i> Officer Sign In
        </button>
      </form>

      <!-- DIVIDER -->
      <div class="relative flex items-center justify-center">
        <div class="border-t border-slate-200 w-full"></div>
        <span class="bg-white px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider relative">or</span>
      </div>

      <!-- GUEST LOGIN ACTION -->
      <div class="space-y-2">
        <a href="home.html" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 border border-slate-200">
          <i data-lucide="users" class="w-4 h-4 text-slate-500"></i> Continue as Guest / Public
        </a>
        <p class="text-[10px] text-slate-400 text-center leading-relaxed">
          Guests can check live tournament fixtures, view initiatives, and register teams freely.
        </p>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-100 bg-white">
    © 2026 Man City Arts & Sports Club.
  </footer>

  <script>
    const SUPABASE_URL = "https://xbrpgpfabthotvbuqlhh.supabase.co";
    // Replace with your real Supabase anon key:
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhicnBncGZhYnRob3R2YnVxbGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDE4NDYsImV4cCI6MjEwNTExNzg0Nn0.Nz3N-2OFBQ3oFGpTJMxQNBNLbHJBvwnXU0afJO53c30";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // If an officer is already logged in, redirect them directly into the portal
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = "portal.html";
      }
      lucide.createIcons();
    });

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errorBox = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Signing in...`;
      errorBox.classList.add('hidden');
      lucide.createIcons();

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorBox.innerText = error.message;
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Officer Sign In`;
        lucide.createIcons();
        return;
      }

      // Success -> Redirect to portal dashboard
      window.location.href = "portal.html";
    }
  </script>
</body>
</html>
