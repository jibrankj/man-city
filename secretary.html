<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>General Secretary - MAN CITY Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-neutral-900 flex justify-center min-h-screen text-slate-800 antialiased selection:bg-sky-500 selection:text-white">

  <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative pb-10">
    <!-- HEADER -->
    <header class="px-5 pt-4 pb-3 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-1.5 -ml-1.5 text-slate-400 hover:text-slate-700 transition">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-lg font-black text-slate-900 leading-tight">G.Secretary Desk</h1>
          <p class="text-xs font-semibold text-sky-600">Events & Volunteer Roster</p>
        </div>
      </div>
      <img src="logo.png" alt="Logo" class="w-8 h-8 object-contain" />
    </header>

    <!-- CONTENT -->
    <main class="p-5 space-y-5 flex-1 overflow-y-auto">

      <!-- QUICK STATS -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-sky-50 border border-sky-100 p-3.5 rounded-2xl">
          <span class="text-[10px] font-bold text-sky-600 uppercase">Live Volunteers</span>
          <div id="stat-count" class="text-2xl font-black text-sky-950 mt-1">...</div>
        </div>
        <div class="bg-emerald-50 border border-emerald-100 p-3.5 rounded-2xl">
          <span class="text-[10px] font-bold text-emerald-600 uppercase">Active Programmes</span>
          <div class="text-2xl font-black text-emerald-950 mt-1">2</div>
        </div>
      </div>

      <!-- VOLUNTEER ROSTER FROM SUPABASE -->
      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-bold text-slate-900 uppercase tracking-wider">Registrations Roster</h2>
          <button onclick="loadVolunteers()" class="text-slate-400 hover:text-slate-700"><i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i></button>
        </div>

        <div id="roster-list" class="space-y-2.5">
          <div class="p-4 text-center text-xs text-slate-400">Loading registrations from Supabase...</div>
        </div>
      </section>

      <!-- RECORD MEETING MINUTES -->
      <section class="bg-slate-50 border border-slate-200/80 p-4 rounded-2xl space-y-2.5">
        <h3 class="text-xs font-bold text-slate-900 flex items-center gap-1.5">
          <i data-lucide="file-text" class="w-4 h-4 text-sky-600"></i> Record Meeting Minutes
        </h3>
        <input type="text" placeholder="Meeting Topic (e.g. Onam Fest Prep)" class="w-full px-3 py-2 bg-white text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500" />
        <textarea placeholder="Summary of decisions and assignments..." rows="2" class="w-full px-3 py-2 bg-white text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 resize-none"></textarea>
        <button class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition">Save to Club Records</button>
      </section>

    </main>
  </div>

  <script>
    lucide.createIcons();

    const SUPABASE_URL = "https://xbrpgpfabthotvbuqlhh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhicnBncGZhYnRob3R2YnVxbGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDE4NDYsImV4cCI6MjEwNTExNzg0Nn0.Nz3N-2OFBQ3oFGpTJMxQNBNLbHJBvwnXU0afJO53c30";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadVolunteers() {
      const container = document.getElementById('roster-list');
      const { data, error } = await supabaseClient
        .from('volunteers')
        .select('*')
        .order('id', { ascending: false });

      if (error || !data) {
        container.innerHTML = `<div class="p-3 text-xs text-red-500 text-center">Failed to fetch registrations.</div>`;
        return;
      }

      document.getElementById('stat-count').innerText = data.length;

      if (data.length === 0) {
        container.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">No volunteers signed up yet.</div>`;
        return;
      }

      container.innerHTML = data.map(v => {
        const cleanPhone = (v.whatsapp || '').replace(/[^0-9]/g, '');
        const waLink = cleanPhone.startsWith('91') ? `https://wa.me/${cleanPhone}` : `https://wa.me/91${cleanPhone}`;

        return `
          <div class="p-3 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-xs font-bold text-slate-900 leading-tight">${v.full_name || 'Volunteer'}</p>
              <span class="text-[10px] text-sky-600 font-semibold">${v.event_title || 'General'}</span>
              <p class="text-[10px] text-slate-400">${v.ward || 'No ward'} • ${v.whatsapp || ''}</p>
            </div>
            <a href="${waLink}" target="_blank" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold rounded-lg flex items-center gap-1 transition">
              <i data-lucide="message-circle" class="w-3 h-3"></i> Chat
            </a>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    loadVolunteers();
  </script>
</body>
</html>
