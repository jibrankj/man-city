<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treasurer Portal - MAN CITY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-neutral-900 flex justify-center min-h-screen text-slate-800 antialiased selection:bg-sky-500 selection:text-white">

  <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative pb-10">

    <!-- HEADER -->
    <header class="px-5 pt-4 pb-3 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-1.5 -ml-1.5 text-slate-400 hover:text-slate-700 transition">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-lg font-black text-slate-900 leading-tight">Treasurer Desk</h1>
          <p class="text-xs font-semibold text-sky-600">Accounts & Financials</p>
        </div>
      </div>
      <img src="logo.png" alt="Logo" class="w-8 h-8 object-contain" />
    </header>

    <!-- CONTENT -->
    <main class="p-5 space-y-5 flex-1 overflow-y-auto">

      <!-- BALANCE CARD -->
      <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-5 rounded-3xl shadow-lg relative overflow-hidden">
        <div class="relative z-10">
          <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Available Club Funds</span>
          <div class="text-3xl font-black mt-1 tracking-tight">₹ 48,250</div>
          <div class="flex items-center gap-4 mt-4 pt-4 border-t border-slate-700/60 text-xs">
            <div>
              <span class="text-slate-400 block text-[10px]">Income</span>
              <span class="font-bold text-emerald-400">+ ₹ 62,500</span>
            </div>
            <div class="w-px h-6 bg-slate-700"></div>
            <div>
              <span class="text-slate-400 block text-[10px]">Expenses</span>
              <span class="font-bold text-rose-400">- ₹ 14,250</span>
            </div>
          </div>
        </div>
      </div>

      <!-- QUICK ACTIONS -->
      <div class="grid grid-cols-2 gap-3">
        <button class="flex items-center justify-center gap-2 p-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold rounded-2xl text-xs transition border border-emerald-200/60">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> Record Income
        </button>
        <button class="flex items-center justify-center gap-2 p-3 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-2xl text-xs transition border border-rose-200/60">
          <i data-lucide="minus-circle" class="w-4 h-4"></i> Add Expense
        </button>
      </div>

      <!-- RECENT TRANSACTIONS -->
      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-bold text-slate-900 uppercase tracking-wider">Recent Transactions</h2>
          <button class="text-[11px] font-semibold text-sky-600 hover:text-sky-700">View All</button>
        </div>

        <div class="space-y-2.5">
          <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-100">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center">
                <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
              </div>
              <div>
                <p class="text-xs font-bold text-slate-800 leading-tight">Sponsorship - 7s Cup</p>
                <span class="text-[10px] text-slate-400">Sep 20 • Areethala Traders</span>
              </div>
            </div>
            <span class="text-xs font-black text-emerald-600">+ ₹ 15,000</span>
          </div>

          <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-100">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-rose-100 text-rose-700 flex items-center justify-center">
                <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
              </div>
              <div>
                <p class="text-xs font-bold text-slate-800 leading-tight">Football Net & 2 Balls</p>
                <span class="text-[10px] text-slate-400">Sep 18 • Sports Shop</span>
              </div>
            </div>
            <span class="text-xs font-black text-rose-600">- ₹ 3,400</span>
          </div>

          <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-100">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center">
                <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
              </div>
              <div>
                <p class="text-xs font-bold text-slate-800 leading-tight">Monthly Member Dues</p>
                <span class="text-[10px] text-slate-400">Sep 15 • 18 Members</span>
              </div>
            </div>
            <span class="text-xs font-black text-emerald-600">+ ₹ 3,600</span>
          </div>
        </div>
      </section>

    </main>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
