<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joint Secretary - MAN CITY Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-neutral-900 flex justify-center min-h-screen text-slate-800 antialiased selection:bg-sky-500 selection:text-white">

  <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative pb-10">
    <!-- HEADER -->
    <header class="px-5 pt-4 pb-3 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-1.5 -ml-1.5 text-slate-400 hover:text-slate-700 transition">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-lg font-black text-slate-900 leading-tight">J.Secretary Desk</h1>
          <p class="text-xs font-semibold text-sky-600">Members & Equipment Log</p>
        </div>
      </div>
      <img src="logo.png" alt="Logo" class="w-8 h-8 object-contain" />
    </header>

    <!-- CONTENT -->
    <main class="p-5 space-y-5 flex-1 overflow-y-auto">

      <!-- ENROLL NEW CLUB MEMBER -->
      <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-4 rounded-3xl space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold text-white flex items-center gap-1.5">
            <i data-lucide="user-plus" class="w-4 h-4 text-sky-400"></i> New Member Entry
          </h3>
          <span class="text-[10px] text-slate-400">Card & Pass</span>
        </div>
        <div class="space-y-2">
          <input type="text" placeholder="Member Full Name" class="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-400" />
          <div class="grid grid-cols-2 gap-2">
            <input type="tel" placeholder="Phone" class="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-xs text-white placeholder-slate-400 focus:outline-none" />
            <input type="text" placeholder="Ward / Area" class="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-xs text-white placeholder-slate-400 focus:outline-none" />
          </div>
          <button class="w-full py-2 bg-sky-500 hover:bg-sky-600 text-white font-bold text-xs rounded-xl shadow transition">
            Register Member
          </button>
        </div>
      </div>

      <!-- EQUIPMENT ISSUE TRACKER -->
      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-bold text-slate-900 uppercase tracking-wider">Equipment Issued</h2>
          <span class="text-[10px] font-bold text-slate-500">Club Store Log</span>
        </div>

        <div class="space-y-2.5">
          <div class="p-3 bg-slate-50 border border-slate-100 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center">
                <i data-lucide="package" class="w-4 h-4"></i>
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-800">Football (Match Ball #2)</h4>
                <p class="text-[10px] text-slate-400">Issued to: Anshad • Ward 19</p>
              </div>
            </div>
            <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">Out</span>
          </div>

          <div class="p-3 bg-slate-50 border border-slate-100 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center">
                <i data-lucide="package-check" class="w-4 h-4"></i>
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-800">Cricket Kit & Cones</h4>
                <p class="text-[10px] text-slate-400">Returned by: Suhaib</p>
              </div>
            </div>
            <span class="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Returned</span>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
